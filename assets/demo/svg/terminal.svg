  <g font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace" font-size="20"><text x="44" y="126"><tspan fill="#ff8a5c">$</tspan> <tspan fill="#e5e5e5">transcribers --version</tspan></text>  <text x="44" y="158" fill="#9ca3af">transcribers 0.0.1 (build 2026.11.15.16.31.15)</text>  </g>  <g font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace" font-size="20"><text x="44" y="190"><tspan fill="#ff8a5c">$</tspan> <tspan fill="#e5e5e5">transcribers --file video.mp4</tspan></text>  <text x="44" y="222" fill="#9ca3af">transcribing... 100%</text>  <text x="44" y="254" fill="#7dd3a8">wrote video.srt</text>  </g>  <g font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace" font-size="20"><text x="44" y="286"><tspan fill="#ff8a5c">$</tspan> <tspan fill="#e5e5e5">transcribers --url "https://youtu.be/jNQXAC9IVRw"</tspan></text>  <text x="44" y="318" fill="#9ca3af">downloading https://youtu.be/jNQXAC9IVRw ...</text>  <text x="44" y="350" fill="#9ca3af">transcribing... 100%</text>  <text x="44" y="382" fill="#7dd3a8">wrote yt-jNQXAC9IVRw.srt</text>  </g>  <g font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace" font-size="20"><text x="44" y="414"><tspan fill="#ff8a5c">$</tspan> <tspan fill="#e5e5e5">transcribers --file video.mp4 --audio-only --audio mp3</tspan></text>  <text x="44" y="446" fill="#7dd3a8">wrote video.mp3</text>  </g></svg>
