    <line x1="256" y1="164" x2="256" y2="284" stroke="#000000" stroke-width="16" stroke-linecap="round"/>
    <line x1="328" y1="188" x2="328" y2="260" stroke="#000000" stroke-width="16" stroke-linecap="round"/>
