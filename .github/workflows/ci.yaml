name: CI

"on":
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
      - name: Ensure cmake
        run: |
          if ! command -v cmake >/dev/null; then
            sudo apt-get update && sudo apt-get install -y cmake
          fi
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: darwin-aarch64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Ensure cmake
        run: |
          if ! command -v cmake >/dev/null; then
            if [ "$RUNNER_OS" = "macOS" ]; then brew install cmake; else sudo apt-get update && sudo apt-get install -y cmake; fi
          fi
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package binary
        run: |
          cp "target/${{ matrix.target }}/release/transcribers" "transcribers-${{ matrix.asset }}"
          ls -lh "transcribers-${{ matrix.asset }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: transcribers-${{ matrix.asset }}
          path: transcribers-${{ matrix.asset }}

  release:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: transcribers-*
          merge-multiple: true
      - name: Checksums
        # Named transcribers-* so the release upload glob picks it up.
        run: sha256sum transcribers-* > transcribers-checksums.txt
      - name: Publish "latest" release (overwrite assets)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest \
              --title "transcribers latest" \
              --notes-file README.md
          fi
          gh release upload latest transcribers-* --clobber
          gh release edit latest --latest --title "transcribers latest" --notes-file README.md

  landing-build:
    name: Landing - Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: packages/landing

  landing-deploy:
    name: Landing - Deploy
    needs: landing-build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5.0.1
