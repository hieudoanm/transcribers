name: CI

'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli-quality:
    name: CLI - Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Ensure cmake
        shell: bash
        run: |
          if ! command -v cmake >/dev/null; then
            if [ "$RUNNER_OS" = "macOS" ]; then brew install cmake; elif [ "$RUNNER_OS" = "Windows" ]; then choco install cmake -y; else sudo apt-get update && sudo apt-get install -y cmake; fi
          fi
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  cli-build:
    name: CLI - Build (${{ matrix.os }})
    # Release binaries are only needed for the master-branch release job;
    # PRs are covered by the `cli-quality` job.
    if: github.event_name != 'pull_request'
    needs: cli-quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Ensure cmake
        shell: bash
        run: |
          if ! command -v cmake >/dev/null; then
            if [ "$RUNNER_OS" = "macOS" ]; then brew install cmake; elif [ "$RUNNER_OS" = "Windows" ]; then choco install cmake -y; else sudo apt-get update && sudo apt-get install -y cmake; fi
          fi
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
      - name: Locate MASM assembler
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          # windows-latest ships VS 18 with multiple MSVC toolsets; CMake's
          # ASM detection can resolve a stale cl.exe path. Point it at the
          # newest real ml64.exe instead. whisper-rs-sys forwards CMAKE_*
          # env vars to cmake as -D defines.
          vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          vsdir="$("$vswhere" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)"
          vsdir="$(cygpath -u "$vsdir")"
          ml64="$(find "$vsdir/VC/Tools/MSVC" -name ml64.exe -path '*Hostx64/x64*' | sort -V | tail -1)"
          if [ -z "$ml64" ]; then echo "ml64.exe not found under $vsdir"; exit 1; fi
          # CMake is a Windows binary: it needs a Windows path, not /c/...
          ml64="$(cygpath -m "$ml64")"
          echo "Using ASM compiler: $ml64"
          echo "CMAKE_ASM_COMPILER=$ml64" >> "$GITHUB_ENV"
          echo "CMAKE_ASM_MASM_COMPILER=$ml64" >> "$GITHUB_ENV"
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package binary
        shell: bash
        run: |
          mkdir -p dist
          ext=""
          if [ "${{ matrix.os }}" = "windows-latest" ]; then ext=".exe"; fi
          cp "target/${{ matrix.target }}/release/transcribers${ext}" "dist/cli-transcribers-${{ matrix.target }}${ext}"
          chmod +x "dist/cli-transcribers-${{ matrix.target }}${ext}"
      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: cli-transcribers-${{ matrix.os }}
          path: dist/cli-transcribers-*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release
    if: github.ref == 'refs/heads/master'
    needs: cli-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          pattern: cli-transcribers-*
          merge-multiple: true
      - name: Delete existing latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          git push origin :refs/tags/latest || true
      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest dist/* \
            --title "transcribers (latest)" \
            --notes-file RELEASE.md \
            --latest

  landing-build:
    name: Landing - Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.23.0

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck landing
        working-directory: packages/landing
        run: pnpm run typecheck

      - name: Lint landing
        working-directory: packages/landing
        run: pnpm run lint

      - name: Build landing (Next.js static export)
        working-directory: packages/landing
        run: pnpm run build

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: packages/landing/out

  landing-deploy:
    name: Landing - Deploy
    needs: landing-build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5.0.1
