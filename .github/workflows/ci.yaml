name: ci

"on":
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            asset: darwin-aarch64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Ensure cmake
        run: |
          if ! command -v cmake >/dev/null; then
            if [ "$RUNNER_OS" = "macOS" ]; then brew install cmake; else sudo apt-get update && sudo apt-get install -y cmake; fi
          fi
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package binary
        run: |
          cp "target/${{ matrix.target }}/release/transcribers" "transcribers-${{ matrix.asset }}"
          ls -lh "transcribers-${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: transcribers-${{ matrix.asset }}
          path: transcribers-${{ matrix.asset }}

  release:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: transcribers-*
          merge-multiple: true
      - name: Publish "latest" release (overwrite assets)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest \
              --title "transcribers latest" \
              --notes "Latest build of transcribers. Assets are overwritten on every push to main."
          fi
          gh release upload latest transcribers-* --clobber
          gh release edit latest --latest --title "transcribers latest"

  pages:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/landing
      - uses: actions/deploy-pages@v5
