[package]
name = "transcribers-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "transcribers"
path = "src/main.rs"

[dependencies]
ffmpeg = { path = "../transcribers-ffmpeg", package = "transcribers-ffmpeg" }
models = { path = "../transcribers-models", package = "transcribers-models" }
whisper = { path = "../transcribers-whisper", package = "transcribers-whisper" }
serde_json = "=1.0.154"
clap = { version = "=4.6.10", features = ["derive"] }
yt-dlp = "=2.10.0"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net", "fs", "io-util"] }
axum = { version = "=0.8.9", features = ["multipart"] }
serde = { version = "=1.0.229", features = ["derive"] }
